name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # bundle ของปลั๊กอินถูก commit ไว้ ทั้ง GitHub Action และ pre-commit เรียกใช้ไฟล์นั้นตรง ๆ
      # ถ้ามันค้างอยู่รุ่นเก่า สองทางนั้นจะรันโค้ดคนละชุดกับที่เทสต์ผ่าน
      - name: bundle ที่ commit ไว้ต้องตรงกับซอร์ส
        run: |
          if ! git diff --quiet -- packages/plugin/bin; then
            echo "::error::packages/plugin/bin ไม่ตรงกับซอร์ส — รัน pnpm run build แล้ว commit ผลลัพธ์"
            git diff --stat -- packages/plugin/bin
            exit 1
          fi

  # Arak ตรวจตัวเอง — สคีมาสาธิตใน examples/demo-app ต้องถูกตัดสินครบเสมอ
  arak:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - id: arak
        uses: ./
        with:
          command: status
          root: examples/demo-app
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.arak.outputs.sarif-file }}
          category: arak-status
