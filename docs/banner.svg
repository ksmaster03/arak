<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Arak — mark personal data while the code is being written">
  <title>Arak — mark personal data while the code is being written</title>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161A"/>
      <stop offset="1" stop-color="#1A2128"/>
    </linearGradient>
    <style>
      .display { font-family: Georgia, "Times New Roman", serif; }
      .sans    { font-family: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans Thai", sans-serif; }
      .mono    { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#ground)"/>
  <rect x="0" y="0" width="6" height="340" fill="#17566F"/>

  <!-- ชื่อโปรเจกต์ -->
  <text class="display" x="64" y="118" font-size="76" font-weight="700" fill="#ECEEF0" letter-spacing="-1">Arak</text>
  <text class="sans" x="258" y="116" font-size="32" fill="#6FB3D0">อารักษ์</text>

  <text class="sans" x="66" y="160" font-size="20" fill="#9BA5AE">
    Mark personal data while the code is being written — not months later in a CI report nobody reads
  </text>
  <text class="sans" x="66" y="190" font-size="19" fill="#6E7A85">
    มาร์กข้อมูลส่วนบุคคลตั้งแต่ตอนที่โค้ดกำลังถูกเขียน แล้วออกเป็นบันทึกตามมาตรา 39
  </text>

  <line x1="64" y1="222" x2="1136" y2="222" stroke="#2E363E" stroke-width="1"/>

  <!-- ตัวอย่างของจริงจากสคีมา -->
  <text class="mono" x="66" y="262" font-size="17" fill="#6FB3D0">/// @pii(category=government_id, purposes=tax_invoice)</text>

  <text class="mono" x="66" y="296" font-size="17" fill="#ECEEF0">citizenId</text>
  <text class="mono" x="186" y="296" font-size="17" fill="#9BA5AE">String?</text>

  <!-- แถบปิดบัง คือหัวใจของเครื่องมือนี้ -->
  <rect x="300" y="281" width="164" height="21" fill="#ECEEF0" rx="2"/>
  <rect x="476" y="281" width="96" height="21" fill="#ECEEF0" rx="2"/>

  <g transform="translate(1006, 268)">
    <rect x="0" y="0" width="130" height="34" rx="3" fill="#16382C" stroke="#2A6248"/>
    <text class="mono" x="14" y="23" font-size="15" fill="#6DBF9B">marked</text>
    <path d="M96 17 l6 7 l12 -14" stroke="#6DBF9B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="mono" x="1136" y="60" font-size="13" fill="#4A555F" text-anchor="end">PolyForm Noncommercial</text>
</svg>
