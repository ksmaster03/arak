# แคตตาล็อกข้อมูลส่วนบุคคล (Arak)
#
# ไฟล์นี้คือแหล่งความจริงเพียงที่เดียวว่าระบบนี้เก็บข้อมูลส่วนบุคคลอะไรบ้าง
# เพื่ออะไร ด้วยฐานทางกฎหมายใด และเก็บไว้นานเท่าไร
# เนื้อหาที่นี่คือสิ่งที่ใช้ออกบันทึกรายการกิจกรรมการประมวลผล (RoPA) ตามมาตรา 39
#
# ส่วน controller / purposes / access / securityMeasures เป็นของคนล้วน ๆ
# เครื่องมือจะไม่แก้ให้ และคอมเมนต์ที่เขียนไว้จะไม่หาย
# ส่วน fields เครื่องมือดูแลให้ตรงกับซอร์สเสมอ แต่จะไม่ลบอะไรทิ้งเอง

version: 1

controller:
  name: บริษัทตัวอย่าง ส่งไว จำกัด
  contact: dpo@example.co.th

purposes:
  - key: delivery
    label: รับคำสั่งซื้อและจัดส่งของถึงผู้รับ
    legalBasis: contract
    retention: P2Y
    description: จำเป็นต่อการปฏิบัติตามสัญญาซื้อขายกับลูกค้า

  - key: tax_invoice
    label: ออกใบกำกับภาษีและเก็บเอกสารตามกฎหมายบัญชี
    legalBasis: legal_obligation
    retention: P5Y
    recipients:
      - กรมสรรพากร

  - key: operations
    label: จัดคนขับและติดตามสถานะงานส่ง
    legalBasis: contract
    retention: P2Y

  - key: security_log
    label: บันทึกการเข้าถึงระบบเพื่อสอบสวนเหตุผิดปกติ
    legalBasis: legitimate_interest
    retention: P1Y

access:
  requestChannel: dpo@example.co.th
  rightsUrl: https://example.co.th/privacy
  whoCanAccess:
    - ทีมปฏิบัติการ เห็นเฉพาะงานที่ตัวเองรับผิดชอบ
    - ผู้ดูแลระบบ เห็นทั้งหมด และทุกครั้งที่เข้าถึงถูกบันทึก
  refusalGrounds:
    - คำขอที่ขัดกับหน้าที่ตามกฎหมายเรื่องการเก็บเอกสารภาษี

securityMeasures:
  - เข้ารหัสระหว่างส่ง (TLS) และเข้ารหัสข้อมูลที่พักอยู่
  - จำกัดสิทธิ์เข้าถึงตามหน้าที่ และบันทึกการเข้าถึงทุกครั้ง
  - ลบข้อมูลอัตโนมัติเมื่อพ้นระยะเวลาเก็บของแต่ละวัตถุประสงค์

